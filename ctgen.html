<!DOCTYPE html>
<html>
<head>

    <style>
        button{
                background-color: cadetblue; 
                border-radius: 12px;
                width: 150px;
                height: 35px;
                font-weight: bold;
                border: 1px solid transparent;
            }

            table{
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                font-weight: normal;
            }

            body{
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            }
    </style>
	
    <script>
        function create() {
            //var str_Severity = document.getElementById("severity");
            //var str_Severity_Value = str_Severity.options[str_Severity.selectedIndex].value.trim();
            //alert(str_Severity_Value);
            var str_ServiceName = document.getElementById("ServiceName");
            var str_ServiceName_Value = "[" + str_ServiceName.options[str_ServiceName.selectedIndex].value.trim() + "]|";
            //alert(str_ServiceName_Value);
            var str_TimeZone = document.getElementById("TimeZone");
            var str_TimeZone_Value = str_TimeZone.options[str_TimeZone.selectedIndex].value.trim();
            //alert(str_ServiceName_Value);
            var str_Region = document.getElementById("Region");
            var str_Region_Value = str_Region.options[str_Region.selectedIndex].value.trim();
            //alert(str_Region_Value);
            var str_OperatingSystem = document.getElementById("OperatingSystem");
            var str_OperatingSystem_Value = str_OperatingSystem.options[str_OperatingSystem.selectedIndex].value.trim();
            //alert(str_OperatingSystem_Value);
            var str_Architecture = document.getElementById("Architecture");
            var str_Architecture_Value = str_Architecture.options[str_Architecture.selectedIndex].value.trim();
            //alert(str_Architecture_Value);
            var str_Categories = document.getElementById("Categories");
            var str_Categories_Value = str_Categories.options[str_Categories.selectedIndex].value.trim();
            //alert(str_Categories_Value);
            var str_Browser = document.getElementById("Browser");
            var str_Browser_Value = str_Browser.options[str_Browser.selectedIndex].value.trim();
            //alert(str_Browser_Value);


            var str_CaseDescription = document.getElementById("CaseDescription").value.trim();
            var str_VSO = document.getElementById("VSOBug").value;
            //alert(str_VSO);
            var str_Date = document.getElementById("contactdate").value;
            //var mystring = mystring.slice(2, myString.length);
            var str_Date1 = str_Date.replace(/-/g, "");
            var str= str_Date1.slice(4);
            //document.getElementById("outputd").value=str;
            //alert(str);
            if ((str_VSO.toString().length == 0))
            {
                document.getElementById("CaseTitle").value = str_ServiceName_Value + str + "|" + str_TimeZone_Value + "|" + str_Region_Value + "|" + str_OperatingSystem_Value + "|" + str_Architecture_Value + "|" + "[" + str_Categories_Value + "]" + "|" + str_Browser_Value + "|" + str_CaseDescription; //"My value";
            }
            else
            {
                document.getElementById("CaseTitle").value = str_ServiceName_Value + str +  "|" + "[" + "Bug#"+ str_VSO + "]" + "|" + str_TimeZone_Value + "|" + str_Region_Value + "|" + str_OperatingSystem_Value + "|" + str_Architecture_Value + "|" + "[" + str_Categories_Value + "]" + "|" + str_Browser_Value + "|" + str_CaseDescription; //"My value";
            }

            document.getElementById("CaseTitle").select();
            document.execCommand('copy');
            alert("Case Title is copied.");
        }

        function ClearTextArea(){
            document.getElementById("CaseTitle").value='';
            document.getElementById("VSOBug").value='';
            document.getElementById("CaseDescription").value='';
            document.getElementById("contactdate").value='';
        }
</script>
</head>

    <body style="color: dimgray;">
        <p>&nbsp;</p>

        <h1 align="center"><span style="text-decoration: underline; color: cadetblue;"><strong>Case Title Generator</strong></span></h1>


        <table align="center" border="1" style="color: dimgray;">
        <tr>
            <td style="text-align: left";> Next Contact Date </td>
            <td>
                <input type="date" name="contactdate" id="contactdate" placeholder="yymmdd">
            </td>
            </tr>
        <tr><td style="text-align: left";>Time Zone</td>
        <td>
        <select id="TimeZone" name="TimeZone" size="1">
            <option value="EST">Eastern</option>
            <option value="CST">Central</option>
            <option value="MST">Mountain</option>
            <option value="PST">Pacific</option>
            <option value="IST">Indian</option>
            <option value="APAC">Asia Pacific & China</option>
            <option value="EMEA">Europe</option>
        </select>
        </td></tr>
        <tr><td style="text-align: left";>Service Level</td>
        <td>
        <select id="ServiceName" name="ServiceName" size="1">
            <option value="S500">S500</option>
            <option value="PRE">Premier</option>
            <option value="PRO">Broad Commercial</option>
            <option value="Uni">Unified Support</option>
        <!-- <option value="Adv">Advanced Premiere</option> -->
        <!-- <option value="Perf_Sup">Performance Support</option> -->
        </select>
        </td></tr>
        <tr><td style="text-align: left";> Region </td>
        <td>
        <select id="Region" name="Region" size="1">
        <option value="AMER">Americas</option>
        <option value="EMEA">EMEA</option>
        <option value="APAC">APAC</option>
        <option value="IND">India</option>
        </select>
        </td></tr>
        <tr><td style="text-align: left";> Operating System </td>
        <td>
        <select id="OperatingSystem" name="OperatingSystem" size="1">
            <option value="Win11">Windows 11</option>
            <option value="Win10_22H2">Windows 10 Build 22H2</option>
            <option value="Win10_21H1">Windows 10 Build 21H1</option>
            <option value="Win10_20H2">Windows 10 Build 20H2</option>
            <option value="Win10_2004">Windows 10 Build 2004</option>
            <option value="Win10_1909">Windows 10 Build 1909</option>
            <option value="Win10_1903">Windows 10 Build 1903</option>
            <option value="Win10_1809">Windows 10 Build 1809</option>
            <option value="Win10_1803">Windows 10 Build 1803</option>
            <option value="Win10_1709">Windows 10 Build 1709</option>
            <option value="Win10_1703">Windows 10 Build 1703</option>
            <option value="Win10_1607">Windows 10 Build 1607</option>
            <option value="Win2022">Windows Server 2022</option>
            <option value="Win2019">Windows Server 2019</option>
            <option value="Win2016">Windows Server 2016</option>
            <option value="Win2016_1809">Windows Server 2016 v1809</option>
            <option value="Win2016_1903">Windows Server 2016 v1903</option>
            <option value="Win2016_1909">Windows Server 2016 v1909</option>
            <option value="Win7SP1_ES">Windows 7 SP1 ES</option>
            <option value="Win7SP1">Windows 7 SP1</option>
            <option value="Win2012R2">Windows Server 2012 R2</option>
            <option value="Win2012">Windows Server 2012</option>
            <option value="Win8.1">Windows 8.1</option>
            <option value="Win8">Windows 8</option>
            <option value="Win2008R2_ES">Windows Server 2008 R2 ES</option>
            <option value="Win2008_ES">Windows Server 2008 ES</option>
            <option value="iOS">iOS</option>
            <option value="Android">Android</option>
            <option value="iOS&Android">iOS and Android</option>
        </select>
        </td></tr>
        <tr><td style="text-align: left";>Architecture</td>
        <td>
        <select id="Architecture" name="Architecture" size="1">
        <option value="x64">x64</option>
        <option value="x86">x86</option>
        </select>
        </td></tr>

        <tr><td style="text-align: left";>Categories</td>
        <td>
        <select id="Categories" name="Categories" size="1">
        <option value="Hang">Hang</option>
        <option value="Crash">Crash</option>
        <option value="Perf">Memory/CPU Performance</option>
        <option value="Leak">Memory Leak</option>
        <option value="GPO">Group Policy</option>
        <option value="Proxy">Proxy</option>
        <option value="Network">Network</option>
        <option value="EMIE">Enterprise Mode</option>
        <option value="Installation">Installation</option>
        <option value="EXT">ActiveX/Extensions</option>
        <option value="SEC">Security</option>
        <option value="SYNC">Sync</option>
        <option value="SignIn">Sign-in</option>
        <option value="AUTH">Authentication</option>
        <option value="Render">Rendering</option>
        <option value="SmartScreen">SmartScreen</option>
        <option value="IEmode">IEMode</option>
        <option value="SDK">Development issues(SDK)</option>
        <option value="CORE">Core Features</option>
        <option value="OT">Miscellaneous</option>
        </select>
        </td></tr>
        <tr><td style="text-align: left";>Browser</td>
        <td>
        <select id="Browser" style="width: 196px;" name="Browser" size="1">
        <option value="IE11">Internet Explorer 11</option>
        <option value="MSEDGE">Microsoft Edge</option>
        <option value="IEMode">IE Mode on Edge</option>
        <option value="WebVw2">WebView2</option>
        <option value="WebOC">Web Browser Control</option>
        &nbsp;</select>
        </td></tr>



        <tr><td colspan="2">
        <input type="text" name="WinCXE" size="100" id="VSOBug" placeholder="Enter the Bug Number (If Applicable)"/>
        </td></tr>
        </p>
        </div>
        </div>
        <div>
        <div>
        <p>&nbsp;</p>
        </div>
        </div>
        <div>
        <div>
        <p>&nbsp;</p>
        </div>
        </div>
        <div>
        <div>
        <tr><td colspan="2">
        <p><input name="CaseDescription" size="100" type="text" id="CaseDescription" placeholder="Please enter the case title summary" /></p>
        </td></tr>
        </div>
        </div>
        <div>
        <div>
        <p>&nbsp;</p>
        </div>
        </div>
        <div>
        <div>
        </table>
        <div style="text-align:center";>
        <p><button type="button" name="Create" onclick="create()" style="display:inline-block;" ><b>Copy the Case Title</b></button>
        <button type="button" name="Reset" onclick="ClearTextArea()" style="display:inline-block;"><b> Reset </b> </button> </p>
        </div>
        <p>
        <div style="text-align:center;">
        <input name="CaseTitle" size="100" type="text" id="CaseTitle"></div>
        </p>
        </div>
    </body>
</html>
