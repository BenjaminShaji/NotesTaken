<!DOCTYPE html>

<html>
    <head>
        <style>
            label{
            display: block;
            width: 200px;
        }

        input{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            border-radius: 4px;
            border: 1px solid dimgray;
            
        }

        textarea{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            border-radius: 4px;
        }

        body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: dimgray;
        }

        label{
            color:dimgray;
        }

        input[type=button]{
                background-color: plum;
                border-radius: 12px;
                width: 150px;
                height: 35px;
                font-weight: bold;
                border: 1px solid transparent;
            }
        </style>

        <script>
            function copyContent(){

                var update = "[Case Update]" + '\n' + document.getElementById("caseUpdate").value + '\n\n';
                var status = "[Current Status]" + '\n' + document.getElementById("currentStatus").value + '\n\n';
                var cDate = "[Next Contact]" + '\n' + document.getElementById("nextContact").value;

                
                
                var clipboardContent = update + status + cDate;

                //alert(clipboardContent);
                //debugger;
                
                document.getElementById("finalOutput").value=clipboardContent;
                var copyText = document.getElementById("finalOutput");
                copyText.select();
                //navigator.clipboard.writeText(copyText.value);
                document.execCommand('copy');

                alert("Case Update is copied.");

            }

            function resetData(){

                document.getElementById("caseUpdate").value='';
                document.getElementById("currentStatus").value='';
                document.getElementById("nextContact").value='';

            }
        </script>
        
    </head>

    <body>
        <h1 align="center"><span style="text-decoration: underline; color: dimgray;"><strong>Case Update/Follow Up</strong></span></h1>

        <label for="caseUpdate">Case Update</label>
        <textarea id="caseUpdate" rows="20" cols="150"></textarea><br><br>

        <label for="currentStatus">Current Status</label>
        <textarea id="currentStatus" rows="5" cols="150"></textarea><br><br>

        <label for="nextContact">Next Contact Date</label>
        <input type="date" id="nextContact" placeholder="dd-mm-yyyy"/><br><br>

        <input type="button" id="copyContent" onclick="copyContent();" value="Copy the Content"/>
        <input type="button" id="reset" onclick="resetData();" value="Reset"/> <br><br>

        <textarea id="finalOutput" style="background-color: black; border: black; width: 0px; height: 0px;"></textarea>
        

    </body>
</html>
