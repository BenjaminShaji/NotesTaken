<!DOCTYPE html>

<html>
    <head>
        <style>
             label{
                display: block;
                width: 800px;
            }

            input{
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                border-radius: 4px;
                                
            }

            textarea{
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                border-radius: 4px;
            }

            body{
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                color: dimgray;
                
            }

            label{
                color: dimgray;
            }

            input[type=text]{
                width: 1015px;
                height: 20px;
                border: 1px solid dimgray;
            }

            input[type=button]{
                background-color: plum; 
                border-radius: 12px;
                width: 150px;
                height: 35px;
                font-weight: bold;
                border: 1px solid transparent;
            }
        </style>

        <script>
            function copyContent(){

                var issueDesc = "[First Call with Customer]" + '\n\n' + "[Issue Description]" + '\n' + document.getElementById("issue").value + '\n\n';
                var envDtls = "[Environment Details]" + '\n' + "Operating System: " + document.getElementById("os").value + '\n' + "Browser Version" + document.getElementById("browser").value + '\n\n';
                var busImpact = "[Business Impact]" + '\n' + document.getElementById("bImpact").value + '\n\n';
                var assessment = "[Assessment]" + '\n' + "When did the problem start happening?" + '\n' + document.getElementById("problem").value + '\n\n' + "Were there any changes made prior to the first report of the issue?" + document.getElementById("change").value + '\n\n' + "Has it ever worked on the same setup?" + '\n' + document.getElementById("everWorked").value + '\n\n' + "Do we have any working scenario?" + '\n' + document.getElementById("working").value + '\n\n' + "How many machines and users are impacted with this issue? (Approximately)" + '\n' + document.getElementById("number").value + '\n\n' + "Did we test on a different version of Browser? What were the results?" + '\n' + document.getElementById("diffVersion").value + '\n\n' + "Can we reproduce the issue consistently or is it an intermittent issue?" + '\n' + document.getElementById("consOrInter").value + '\n\n' + "Does the issue happen with any specific application?" + '\n' + document.getElementById("specApp").value + '\n\n' + "If it is with a specific application, what is the URL of the application? Is the application internal or publicly accessible?" + '\n' + document.getElementById("appType").value + '\n\n' + "Is the affected machine physical or virtual machine?" + '\n' + document.getElementById("machineType").value + '\n\n' + "Additional Information" + '\n' + document.getElementById("addInfo").value + '\n\n';
                var tShooting = "[Troubleshooting]" + '\n' + document.getElementById("troubleshooting").value + '\n\n';
                var reproSteps = "[Steps to Reproduce the Issue]" + '\n' + document.getElementById("repro").value + "\n\n";
                var action = "[Next Action Plan]" + '\n' + "Pending on Microsoft:" + '\n' + document.getElementById("actionMS").value + '\n\n' + "Pending on Customer:" + '\n' + document.getElementById("actionCx").value + '\n\n';
                var logsCollected = "[Logs Collected]" + '\n' + document.getElementById("logs").value + '\n\n';
                var currStatus = "[Current Status]" + '\n' + document.getElementById("status").value + '\n\n';
                var cDate = "[Next Contact]" + '\n' + document.getElementById("nextContact").value;
                
                
                var clipboardContent = issueDesc + envDtls + busImpact + assessment + reproSteps + tShooting + action + logsCollected + currStatus + cDate;

                //alert(clipboardContent);
                //debugger;
                
                document.getElementById("finalOutput").value=clipboardContent;
                var copyText = document.getElementById("finalOutput");
                copyText.select();
                //navigator.clipboard.writeText(copyText.value);
                document.execCommand('copy');

                alert("First call details are copied.");
                
            }

            function resetData(){

                document.getElementById("issue").value='';
                document.getElementById("os").value='';
                document.getElementById("browser").value='';
                document.getElementById("bImpact").value='';
                document.getElementById("problem").value='';
                document.getElementById("change").value='';
                document.getElementById("everWorked").value='';
                document.getElementById("working").value='';
                document.getElementById("number").value='';
                document.getElementById("diffVersion").value='';
                document.getElementById("consOrInter").value='';
                document.getElementById("specApp").value='';
                document.getElementById("appType").value='';
                document.getElementById("repro").value='';
                document.getElementById("machineType").value='';
                document.getElementById("addInfo").value='';
                document.getElementById("troubleshooting").value='';
                document.getElementById("actionMS").value='';
                document.getElementById("actionCx").value='';
                document.getElementById("logs").value='';
                document.getElementById("status").value='';
                document.getElementById("nextContact").value='';

            }
        </script>
    </head>

    <body>
        <h1 align="center"><span style="text-decoration: underline; color: dimgray;"><strong>First Call with Customer</strong></span></h1>

        <label for="issue">Issue Description</label>
        <textarea id="issue" rows="2" cols="150"></textarea><br><br>

        <label>Environment Details</label><br>
        <label for="os">Operating System</label>
        <input type="text" id="os" style="width: 300px;"/><br>
        <label for="browser">Browser Version</label>
        <input type="text" id="browser" style="width: 300px;"/><br><br>

        <label for="bImpact">Business Impact</label>
        <input type="text" id="bImpact"/><br><br>

        <label>Assessment</label><br>
        <label>When did the problem start happening?</label>
        <input type="text" id="problem"/><br><br>

        <label>Were there any changes made prior to the first report of the issue?</label>
        <input type="text" id="change"/><br><br>

        <label>Has it ever worked on the same setup?</label>
        <input type="text" id="everWorked"/><br><br>

        <label>Do we have any working scenario?</label>
        <input type="text" id="working"/><br><br>

        <label>How many machines and users are impacted with this issue? (Approximately)</label>
        <input type="text" id="number"/><br><br>

        <label>Did we test on a different version of Browser? What were the results?</label>
        <input type="text" id="diffVersion"/><br><br>

        <label>Can we reproduce the issue consistently or is it an intermittent issue?</label>
        <input type="text" id="consOrInter"/><br><br>

        <label>Does the issue happen with any specific application?</label>
        <input type="text" id="specApp"/><br><br>

        <label>If it is with a specific application, what is the URL of the application? Is the application internal or publicly accessible?</label>
        <input type="text" id="appType"/><br><br>

        <label>Steps to reproduce the issue.</label>
        <textarea id="repro" rows="10" cols="150"></textarea><br><br>

        <label>Is the affected machine physical or virtual machine?</label>
        <input type="text" id="machineType"/><br><br>

        <label>Any additional information</label>
        <textarea id="addInfo" rows="10" cols="150"></textarea><br><br>

        <label for="troubleshooting">Troubleshooting</label>
        <textarea id="troubleshooting" rows="20" cols="150"></textarea><br><br>

        <label for="actionMS">Next Action Plan (Microsoft)</label>
        <textarea id="actionMS" rows="5" cols="150"></textarea><br><br>

        <label for="actionCx">Next Action Plan (Customer)</label>
        <textarea id="actionCx" rows="5" cols="150"></textarea><br><br>

        <label for="logs">Logs Collected</label>
        <textarea id="logs" rows="10" cols="150"></textarea><br><br>

        <label for="status">Current Status</label>
        <textarea id="status" rows="10" cols="150"></textarea><br><br>

        <label for="nextContact">Next Contact Date</label>
        <input type="date" id="nextContact" placeholder="dd-mm-yyyy"/><br><br>

        <input type="button" id="copyContent" onclick="copyContent();" value="Copy the Content"/>
        <input type="button" id="reset" onclick="resetData();" value="Reset"/> <br><br>

        <textarea id="finalOutput" style="background-color: black; border: black; width: 0px; height: 0px;"></textarea>
    </body>
</html>
